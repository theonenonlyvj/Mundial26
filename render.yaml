# Render Blueprint for Mundial26's PUBLIC SITE — the static SPA only.
#
# Architecture: this static site is a permanent final-results archive. All data
# is bundled at build time. The former Worker and Express backends were deleted
# and must not be restored from this blueprint.
services:
  # --- SPA static site (CDN, always-on, no spin-down) ---
  # Static sites use type:web + runtime:static in the current Render schema.
  - type: web
    runtime: static
    name: mundial26-app
    # --include=dev so vite/react build plugins (devDependencies) are installed.
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
